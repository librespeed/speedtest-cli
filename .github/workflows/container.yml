name: Container

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  container:
    name: Build container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: librespeed-cli:ci

      - name: Smoke test image
        run: docker run --rm librespeed-cli:ci --version
